# About (tek paragraf, iki yana yaslı)
resume_header_intro: "<p style='text-align: justify;'>I am a multidisciplinary professional with a strong background in <b>Electrical & Electronics Engineering</b> and growing expertise in <b>Digital Marketing and Social Media Management</b>. After graduating from <b>Sakarya University</b> with a focus on renewable energy and smart grid systems, I gained valuable industry experience across the energy and environmental technologies sectors. My career path has involved roles in sales engineering, purchasing, and technical support, where I consistently bridged the gap between commercial goals and technical requirements. In parallel with my engineering career, I developed a solid foundation in <b>digital marketing</b>&mdash;including <b>SEO, Google Ads, Facebook &amp; Instagram campaigns, and audience-targeted advertising strategies</b>. These skills have allowed me to enhance brand visibility, improve customer acquisition, and contribute to sustainable business growth. I am passionate about <b>innovation, efficiency, and sustainability</b>, with a long-term goal of integrating engineering expertise and digital marketing capabilities to create impactful projects. Outside of work, I enjoy exploring music production, cultural activities, and digital media trends, which continuously inspire my creativity and adaptability.</p>"

resume_looking_for_work:        "yes"

