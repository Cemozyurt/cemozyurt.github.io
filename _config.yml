resume_header_intro: "<p>I am a multidisciplinary professional with a strong background in Electrical & Electronics Engineering and growing expertise in Digital Marketing and Social Media Management. After graduating from Sakarya University with a focus on renewable energy and smart grid systems, I gained valuable industry experience across the energy and environmental technologies sectors. My career path has involved roles in sales engineering, purchasing, and technical support, where I consistently bridged the gap between commercial goals and technical requirements. In parallel with my engineering career, I developed a solid foundation in digital marketing—including SEO, Google Ads, Facebook & Instagram campaigns, and audience-targeted advertising strategies. These skills have allowed me to enhance brand visibility, improve customer acquisition, and contribute to sustainable business growth. I am passionate about innovation, efficiency, and sustainability, with a long-term goal of integrating engineering expertise and digital marketing capabilities to create impactful projects. Outside of work, I enjoy exploring music production, cultural activities, and digital media trends, which continuously inspire my creativity and adaptability.</p>"

